# Only the application security log is collected. No nginx/access logs.
# Load imfile once; remove the next line if the host already loads it.
module(load="imfile")
ruleset(name="webvpn_security") {
    action(type="omfile" file="/var/log/webvpn-security-syslog.log"
           template="RSYSLOG_SyslogProtocol23Format")
    # School forwarding: configure approved receiver details before enabling.
    # action(type="omfwd" target="SCHOOL_LOG_HOST" port="514" protocol="tcp"
    #        template="RSYSLOG_SyslogProtocol23Format"
    #        action.resumeRetryCount="-1"
    #        queue.type="LinkedList" queue.filename="webvpn_security_forward"
    #        queue.maxDiskSpace="512m" queue.saveOnShutdown="on")
    stop
}
input(type="imfile" File="/var/log/webvpn/security.jsonl"
      Tag="webvpn-security" Facility="local6" Severity="info"
      PersistStateInterval="1" Ruleset="webvpn_security")
